name: CI/CD Pipeline

on:
  # 1. Runs tests automatically on every push to main
  push:
    branches: [ "main" ]

  # 2. Manual trigger for when you actually want to deploy to MonsterASP
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Choose what to deploy'
        required: true
        default: 'api_and_web'
        type: choice
        options:
        - api_and_web
        - api_only
        - web_only

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Tests
      run: dotnet test PhotoAevumStudio.slnx -c Release

  deploy-api:
    name: Deploy API to MonsterASP
    needs: build-and-test
    # Conditional execution: Only runs if manually triggered AND includes API
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'api_and_web' || github.event.inputs.deploy_target == 'api_only')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Publish API Project
      run: dotnet publish PhotoAevumStudioBackend/PhotoAevumStudio.Api/PhotoAevumStudio.Api.csproj -c Release -o ./publish-api
        
    - name: FTP Deploy API to MonsterASP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: site96971.siteasp.net
        username: site96971
        password: ${{ secrets.API_FTP_PASSWORD }}
        local-dir: ./publish-api/
        server-dir: ./

  deploy-web:
    name: Deploy Web to MonsterASP
    needs: build-and-test
    # Conditional execution: Only runs if manually triggered AND includes Web
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'api_and_web' || github.event.inputs.deploy_target == 'web_only')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Publish Web Project
      run: dotnet publish PhotoAevumStudioFrontend/PhotoAevumStudio.Web/PhotoAevumStudio.Web.csproj -c Release -o ./publish-web
        
    - name: FTP Deploy Web to MonsterASP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: site98282.siteasp.net
        username: site98282
        password: ${{ secrets.WEB_FTP_PASSWORD }}
        local-dir: ./publish-web/
        server-dir: ./
