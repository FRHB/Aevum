name: Build and Deploy to MonsterASP

on:
  push:
    branches: [ main ] # Change to 'master' if your main branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Match your target .NET version

    - name: Restore dependencies
      run: dotnet restore PhotoAevumStudioBackend/PhotoAevumStudio.Web/PhotoAevumStudio.Web.csproj

    - name: Build and Publish
      run: dotnet publish PhotoAevumStudioBackend/PhotoAevumStudio.Web/PhotoAevumStudio.Web.csproj -c Release -o ./publish

    - name: Deploy via FTP/Git to MonsterASP
      # Alternatively, you can use MonsterASP's built-in Git deployment 
      # by pushing the generated './publish' contents, or use an FTP action.
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
