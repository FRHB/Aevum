name: Deploy to MonsterASP

on:
  push:
    branches: [ "main" ] # Runs every time you push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x' # Change to 9.0.x if you are using .NET 9

    - name: Publish App
      run: dotnet publish -c Release -o ./publish_output

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: site98282.siteasp.net
        username: site98282
        password: T!z3hY9@8s-N
        local-dir: ./publish_output/
